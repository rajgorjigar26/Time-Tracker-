<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimeLog">
<meta name="theme-color" content="#c8ff00">
<title>TimeLog</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --card: #1a1a1a;
  --border: #272727;
  --accent: #c8ff00;
  --accent2: #ff6b35;
  --text: #f0f0f0;
  --muted: #555;
  --danger: #ff4444;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; overscroll-behavior: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: max(var(--safe-top), 20px) 16px max(var(--safe-bot), 20px);
}

/* ── TABS ── */
.tabs {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
  gap: 4px;
}

.tab-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  padding: 10px 8px;
  border-radius: 9px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.2s;
  touch-action: manipulation;
}

.tab-btn.active {
  background: var(--accent);
  color: #0a0a0a;
}

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── HEADER ── */
header { text-align: center; margin-bottom: 22px; }

header h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 2rem;
  letter-spacing: -1px;
  color: var(--accent);
  line-height: 1;
}

header p {
  color: var(--muted);
  font-size: 0.6rem;
  margin-top: 4px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ── CLOCK ── */
.clock-display {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.clock-display::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0);
}

.clock-display.running::before { animation: sweep 2s linear infinite; }

@keyframes sweep {
  0%   { transform: scaleX(0); transform-origin: left; }
  49%  { transform: scaleX(1); transform-origin: left; }
  50%  { transform: scaleX(1); transform-origin: right; }
  100% { transform: scaleX(0); transform-origin: right; }
}

.live-time { font-size: 2.8rem; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums; }
.live-date { color: var(--muted); font-size: 0.65rem; margin-top: 4px; letter-spacing: 1px; }

.status-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px;
  border-radius: 99px;
  font-size: 0.6rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: var(--border);
  color: var(--muted);
  transition: all 0.3s;
}

.status-badge.active {
  background: rgba(200,255,0,0.12);
  color: var(--accent);
}

.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  transition: all 0.3s;
}

.status-badge.active .status-dot {
  background: var(--accent);
  animation: blink 1s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.elapsed {
  font-size: 0.62rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.elapsed.running { color: var(--accent); }

/* ── SESSION TIME BOXES ── */
.session-times {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.time-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}

.time-box label {
  display: block;
  font-size: 0.55rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}

.time-box .val { font-size: 0.88rem; font-weight: 700; min-height: 20px; }
.start-box .val { color: var(--accent); }
.stop-box .val  { color: var(--accent2); }

/* ── MAIN BUTTONS ── */
.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.main-btn {
  border: none;
  border-radius: 14px;
  padding: 20px 16px;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  letter-spacing: 1px;
  touch-action: manipulation;
  transition: transform 0.1s, filter 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.main-btn:active:not(:disabled) { transform: scale(0.95); filter: brightness(0.88); }
.main-btn:disabled { cursor: not-allowed; opacity: 0.35; }

#startBtn { background: var(--accent); color: #0a0a0a; }
#stopBtn  { background: transparent; color: var(--accent2); border: 2px solid var(--accent2); }
#stopBtn:not(:disabled):active { background: var(--accent2); color: #fff; }

/* ── REMARKS ── */
.remarks-section { margin-bottom: 18px; }

.remarks-section label {
  display: block;
  font-size: 0.58rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}

.remarks-section textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  padding: 12px 14px;
  resize: none;
  height: 68px;
  outline: none;
  transition: border-color 0.2s;
}

.remarks-section textarea:focus { border-color: var(--accent); }
.remarks-section textarea::placeholder { color: #333; }

/* ── LOG PAGE ── */
.log-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 8px;
}

.log-controls h2 {
  font-family: 'Syne', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
}

.log-controls-right { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.58rem;
  padding: 6px 11px;
  border-radius: 8px;
  letter-spacing: 1px;
  font-family: 'Space Mono', monospace;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.15s;
  white-space: nowrap;
}

.icon-btn:active { border-color: var(--accent); color: var(--accent); }
.icon-btn.danger:active { border-color: var(--danger); color: var(--danger); }

/* ── SEARCH ── */
.search-bar {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  padding: 10px 14px;
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}

.search-bar:focus { border-color: var(--accent); }
.search-bar::placeholder { color: #333; }

/* ── STATS BAR ── */
.stats-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.stat-box .stat-val {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--accent);
  display: block;
}

.stat-box .stat-lbl {
  font-size: 0.52rem;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 2px;
  display: block;
}

/* ── TABLE ── */
.log-table-wrap {
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
}

table { width: 100%; border-collapse: collapse; font-size: 0.68rem; }

thead th {
  background: var(--surface);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 0.52rem;
  padding: 9px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-weight: 400;
  white-space: nowrap;
}

tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:active { background: #1a1a1a; }

tbody td { padding: 9px 10px; vertical-align: top; }

.td-num   { color: var(--muted); font-size: 0.55rem; white-space: nowrap; }
.td-start { color: var(--accent); white-space: nowrap; font-size: 0.65rem; }
.td-stop  { color: var(--accent2); white-space: nowrap; font-size: 0.65rem; }
.td-dur   { font-weight: 700; white-space: nowrap; font-size: 0.65rem; }
.td-date  { color: var(--muted); white-space: nowrap; font-size: 0.6rem; }
.td-rem   { min-width: 110px; max-width: 160px; }

.rem-text {
  display: block;
  color: #999;
  margin-bottom: 5px;
  word-break: break-word;
  font-size: 0.65rem;
  line-height: 1.4;
}

.edit-btn {
  display: inline-block;
  background: transparent;
  border: 1px solid #2e2e2e;
  color: #666;
  font-size: 0.52rem;
  padding: 3px 8px;
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: 1px;
  font-family: 'Space Mono', monospace;
  touch-action: manipulation;
  line-height: 1.6;
}

.edit-btn:active { border-color: var(--accent); color: var(--accent); }

.edit-textarea {
  width: 100%;
  background: #0e0e0e;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  padding: 7px 9px;
  outline: none;
  resize: none;
  height: 55px;
  margin-bottom: 5px;
  display: block;
}

.edit-action-row { display: flex; gap: 5px; }

.save-btn {
  background: var(--accent);
  border: none;
  color: #0a0a0a;
  font-size: 0.55rem;
  padding: 5px 11px;
  border-radius: 5px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.6;
  touch-action: manipulation;
}

.cancel-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.55rem;
  padding: 5px 11px;
  border-radius: 5px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  line-height: 1.6;
  touch-action: manipulation;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 0.7rem;
  letter-spacing: 1px;
  line-height: 2;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(90px);
  background: #1e1e1e;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 10px 22px;
  border-radius: 99px;
  font-size: 0.65rem;
  letter-spacing: 1px;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  z-index: 9999;
  white-space: nowrap;
  pointer-events: none;
}

#toast.show { transform: translateX(-50%) translateY(0); }

/* ── SCROLLABLE LOG ── */
.log-scroll { max-height: 55vh; overflow-y: auto; }
.log-scroll::-webkit-scrollbar { width: 3px; }
.log-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

</style>
</head>
<body>

<!-- Tab Navigation -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('tracker')">&#9654; TRACKER</button>
  <button class="tab-btn" onclick="showTab('log')">&#9776; LOG</button>
</div>

<!-- ═══ TRACKER TAB ═══ -->
<div id="tab-tracker" class="page active">

  <header>
    <h1>TIMELOG</h1>
    <p>Session Tracker</p>
  </header>

  <div class="clock-display" id="clockBox">
    <div class="live-time" id="liveClock">--:--:--</div>
    <div class="live-date" id="liveDate">—</div>
    <div class="status-row">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Idle</span>
      </div>
      <span class="elapsed" id="elapsed"></span>
    </div>
  </div>

  <div class="session-times">
    <div class="time-box start-box">
      <label>&#9654; Started</label>
      <div class="val" id="startVal">—</div>
    </div>
    <div class="time-box stop-box">
      <label>&#9632; Stopped</label>
      <div class="val" id="stopVal">—</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="main-btn" id="startBtn" onclick="startSession()">&#9654;&nbsp; START</button>
    <button class="main-btn" id="stopBtn"  onclick="stopSession()" disabled>&#9632;&nbsp; STOP</button>
  </div>

  <div class="remarks-section">
    <label>Remarks (optional)</label>
    <textarea id="remarksInput" placeholder="What are you working on?"></textarea>
  </div>

</div>

<!-- ═══ LOG TAB ═══ -->
<div id="tab-log" class="page">

  <div class="log-controls">
    <h2>Session Log</h2>
    <div class="log-controls-right">
      <button class="icon-btn" onclick="exportCSV()">&#8593; CSV</button>
      <button class="icon-btn danger" onclick="clearLog()">&#128465; CLEAR</button>
    </div>
  </div>

  <input class="search-bar" id="searchBar" type="text" placeholder="Search remarks..." oninput="renderLog()">

  <div class="stats-bar" id="statsBar">
    <div class="stat-box"><span class="stat-val" id="statTotal">0</span><span class="stat-lbl">Sessions</span></div>
    <div class="stat-box"><span class="stat-val" id="statToday">0</span><span class="stat-lbl">Today</span></div>
    <div class="stat-box"><span class="stat-val" id="statTime">0m</span><span class="stat-lbl">Today Total</span></div>
  </div>

  <div class="log-table-wrap">
    <div class="log-scroll">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Start</th>
            <th>Stop</th>
            <th>Dur</th>
            <th>Remarks</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="6" class="empty-state">No sessions yet.<br>Go to Tracker and hit START.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast">Saved!</div>

<script>
// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}

// ── State ──
var sessionStart = null;
var elapsedTimer = null;
var sessions = JSON.parse(localStorage.getItem('timelog_v3') || '[]');

// ── Tabs ──
function showTab(name) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'log') renderLog();
}

// ── Helpers ──
function fmt(d) {
  return [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(function(n){ return String(n).padStart(2,'0'); }).join(':');
}

function fmtDate(d) {
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function fmtDateShort(d) {
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
}

function durStr(ms) {
  var tot = Math.floor(ms / 1000);
  var h = Math.floor(tot / 3600);
  var m = Math.floor((tot % 3600) / 60);
  var s = tot % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + s + 's';
  return s + 's';
}

function durMins(ms) {
  return Math.round(ms / 60000);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function saveData() {
  localStorage.setItem('timelog_v3', JSON.stringify(sessions));
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ── Clock ──
function updateClock() {
  var now = new Date();
  document.getElementById('liveClock').textContent = fmt(now);
  document.getElementById('liveDate').textContent =
    now.toLocaleDateString('en-IN', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
}

setInterval(updateClock, 1000);
updateClock();

// ── Elapsed timer ──
function updateElapsed() {
  if (!sessionStart) return;
  var ms = new Date() - sessionStart;
  document.getElementById('elapsed').textContent = durStr(ms);
}

// ── Session control ──
function startSession() {
  sessionStart = new Date();
  document.getElementById('startVal').textContent = fmt(sessionStart);
  document.getElementById('stopVal').textContent = '—';
  document.getElementById('remarksInput').value = '';
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('statusBadge').classList.add('active');
  document.getElementById('statusText').textContent = 'Active';
  document.getElementById('clockBox').classList.add('running');
  document.getElementById('elapsed').classList.add('running');
  elapsedTimer = setInterval(updateElapsed, 1000);
  if (navigator.vibrate) navigator.vibrate(50);
}

function stopSession() {
  clearInterval(elapsedTimer);
  var stopTime = new Date();
  var remarks  = document.getElementById('remarksInput').value.trim();
  var duration = stopTime - sessionStart;

  document.getElementById('stopVal').textContent = fmt(stopTime);
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled  = true;
  document.getElementById('statusBadge').classList.remove('active');
  document.getElementById('statusText').textContent = 'Idle';
  document.getElementById('clockBox').classList.remove('running');
  document.getElementById('elapsed').textContent = '';
  document.getElementById('elapsed').classList.remove('running');

  var today = new Date().toDateString();
  sessions.unshift({
    date:     fmtDateShort(sessionStart),
    dateStr:  today,
    start:    fmt(sessionStart),
    stop:     fmt(stopTime),
    ms:       duration,
    duration: durStr(duration),
    remarks:  remarks
  });

  saveData();
  showToast('Session saved ✓');
  if (navigator.vibrate) navigator.vibrate([50, 80, 50]);
  sessionStart = null;
}

// ── Stats ──
function updateStats(filtered) {
  var today = new Date().toDateString();
  var todaySessions = sessions.filter(function(s){ return s.dateStr === today; });
  var todayMs = todaySessions.reduce(function(a,s){ return a + (s.ms||0); }, 0);
  var totalMins = Math.round(todayMs / 60000);
  var dispTime = totalMins >= 60
    ? Math.floor(totalMins/60) + 'h ' + (totalMins%60) + 'm'
    : totalMins + 'm';

  document.getElementById('statTotal').textContent = sessions.length;
  document.getElementById('statToday').textContent = todaySessions.length;
  document.getElementById('statTime').textContent  = dispTime;
}

// ── Render Log ──
function renderLog() {
  updateStats();
  var q = (document.getElementById('searchBar').value || '').toLowerCase();
  var tbody = document.getElementById('logBody');
  var filtered = sessions.filter(function(s){
    return !q || (s.remarks && s.remarks.toLowerCase().indexOf(q) > -1);
  });

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">' +
      (q ? 'No results for "' + escHtml(q) + '"' : 'No sessions yet.<br>Go to Tracker and hit START.') +
      '</td></tr>';
    return;
  }

  var rows = '';
  for (var i = 0; i < filtered.length; i++) {
    var s = filtered[i];
    var realIdx = sessions.indexOf(s);
    var num = sessions.length - realIdx;
    var remHtml = s.remarks
      ? '<span class="rem-text">' + escHtml(s.remarks) + '</span>'
      : '<span class="rem-text" style="color:#2e2e2e">—</span>';

    rows += '<tr>' +
      '<td class="td-num">' + num + '</td>' +
      '<td class="td-date">' + (s.date||'—') + '</td>' +
      '<td class="td-start">' + s.start + '</td>' +
      '<td class="td-stop">'  + s.stop  + '</td>' +
      '<td class="td-dur">'   + s.duration + '</td>' +
      '<td class="td-rem" id="cell-' + realIdx + '">' +
        remHtml +
        '<button class="edit-btn" onclick="startEdit(' + realIdx + ')">&#9998; EDIT</button>' +
      '</td>' +
    '</tr>';
  }
  tbody.innerHTML = rows;
}

// ── Edit remarks ──
function startEdit(i) {
  var cell = document.getElementById('cell-' + i);
  if (!cell) return;
  var current = sessions[i].remarks || '';
  cell.innerHTML =
    '<textarea class="edit-textarea" id="einput-' + i + '">' + escHtml(current) + '</textarea>' +
    '<div class="edit-action-row">' +
      '<button class="save-btn" onclick="saveEdit(' + i + ')">&#10004; SAVE</button>' +
      '<button class="cancel-btn" onclick="renderLog()">&#10005;</button>' +
    '</div>';
  document.getElementById('einput-' + i).focus();
}

function saveEdit(i) {
  var val = document.getElementById('einput-' + i).value.trim();
  sessions[i].remarks = val;
  saveData();
  renderLog();
  showToast('Remark updated ✓');
}

// ── Export CSV ──
function exportCSV() {
  if (!sessions.length) { showToast('No sessions to export'); return; }
  var rows = ['#,Date,Start,Stop,Duration,Remarks'];
  sessions.forEach(function(s, i) {
    var rem = (s.remarks || '').replace(/"/g, '""');
    rows.push((sessions.length - i) + ',' + (s.date||'') + ',' + s.start + ',' + s.stop + ',' + s.duration + ',"' + rem + '"');
  });
  var blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'timelog-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported ✓');
}

// ── Clear ──
function clearLog() {
  if (!sessions.length) return;
  if (confirm('Delete all ' + sessions.length + ' sessions? This cannot be undone.')) {
    sessions = [];
    localStorage.removeItem('timelog_v3');
    renderLog();
    showToast('Log cleared');
  }
}

renderLog();
</script>
